<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Harness, Open Graph card, option 2</title>
<!-- Fonts: Inter and Source Serif 4, both SIL OFL 1.1, loaded from Google Fonts at render time. No font software is bundled here. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,600&display=block">
<style>
  /* Fonts load from Google Fonts at render time, as the site itself does; no font software is bundled or redistributed. */
  :root {
    --bg: #FFF9F3; --surface: #FAFAF9;
    --border-warm: #E8D4C0; --border-accent: #D4A574;
    --text: #2C2418; --text-secondary: #5C5347;
    --accent-warm: #C4763B; --warm-ink: #96511F;
    --new: #2F7A4D; --new-ink: #1F5C38; --new-bg: #EAF4EE; --new-border: #B5D6C2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--text); }
  body { position: relative; font-family: 'Inter', system-ui, sans-serif; text-align: center; }

  /* Safe area is the centered 1000 x 500. The composition is also symmetric about the vertical axis so a centered square crop keeps it whole. */
  .mark { position: absolute; left: 0; right: 0; top: 78px; }
  .mark svg { width: 96px; height: 96px; display: inline-block; }

  h1 { position: absolute; left: 0; right: 0; top: 200px; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 84px; line-height: 1; letter-spacing: -0.025em; }

  .tagline { position: absolute; left: 0; right: 0; top: 312px; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-weight: 600; font-size: 40px; line-height: 1.2; color: var(--warm-ink); }

  .runtimes { position: absolute; left: 0; right: 0; top: 440px; }
  .runtimes .label { display: block; font-size: 22px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 18px; }
  .runtimes .row { display: flex; justify-content: center; align-items: center; gap: 18px; }
  .chip { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 1; padding: 18px 30px 20px; border-radius: 999px; background: var(--text); color: #FFF9F3; }
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <rect x="0.125" y="0.125" width="15.75" height="15.75" rx="2" fill="#FFFFFF" stroke="#E8D4C0" stroke-width="0.25"/>
      <circle cx="8" cy="8.5" r="6.5" fill="#2C2418"/>
      <path d="M9.6 6.6 L12.1 3.6" fill="none" stroke="#C4763B" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </div>

  <h1>Agent Harness</h1>
  <div class="tagline">Your way of working,<br>across AI agents.</div>

  <div class="runtimes">
    <span class="label">Projected into</span>
    <div class="row"><div class="chip">Claude Code</div><div class="chip">Codex</div></div>
  </div>
</body>
</html>
